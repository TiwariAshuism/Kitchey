version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kitzz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitzz
      POSTGRES_PASSWORD: kitzz_dev_pass
      POSTGRES_DB: kitzz
    # Host 5433 avoids clash with a local PostgreSQL install on 5432 (common on Windows).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitzz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kitzz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: kitzz-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
