name: kitzz
description: "Kitzz - Kitchen messaging via Alexa"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0

  # Auth & security
  flutter_secure_storage: ^9.2.4

  # Push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Navigation
  go_router: ^15.1.2

  # UI
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
